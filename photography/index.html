    <!-- Read theme from localStorage before paint to avoid flash -->
    <script>
      (function () {
        try {
          var key = "portfolio-theme";
          var stored = localStorage.getItem(key);
          var theme = (stored === "dark" || stored === "light")
            ? stored
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {}
        try {
          if (localStorage.getItem("portfolio-marie-kondo") !== "off") {
            document.documentElement.setAttribute("data-marie-kondo", "on");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-marie-kondo", "on");
        }
        try {
          // Default off; only enable when the user explicitly chose on.
          if (localStorage.getItem("portfolio-perf-mode") === "on")
            document.documentElement.setAttribute("data-perf-mode", "on");
        } catch (_) {}
        try {
          // Default on; only skip when the user explicitly chose off.
          if (localStorage.getItem("portfolio-video-bg") !== "off") {
            document.documentElement.setAttribute("data-video-bg", "on");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-video-bg", "on");
        }
        try {
          // Default off; only an explicit "on" enables the bubbles.
          if (localStorage.getItem("portfolio-animations") === "on") {
            document.documentElement.setAttribute("data-animations", "on");
          }
        } catch (_) {}
        try {
          var supported = /^(en|fr|it|ja|zh|pl)$/;
          var lang = "";
          try { lang = String(localStorage.getItem("portfolio-language") || "").toLowerCase(); } catch (_) {}
          if (!supported.test(lang)) {
            lang = "";
            var list = [];
            try {
              if (navigator.languages) list = list.concat(Array.prototype.slice.call(navigator.languages));
              if (navigator.language) list.push(navigator.language);
            } catch (_) {}
            for (var li = 0; li < list.length && !lang; li += 1) {
              var raw = String(list[li] || "").toLowerCase().replace(/_/g, "-");
              var base = raw.split("-")[0];
              if (supported.test(raw)) lang = raw;
              else if (supported.test(base)) lang = base;
            }
          }
          if (supported.test(lang)) document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>

    <script>
      /* ── Gallery ──────────────────────────────────────────── */
      const PHOTOS_JSON = "../photos/index.json";
      let photos = [];
      let activeIndex = 0;

      async function loadPhotos() {
        const res = await fetch(PHOTOS_JSON + "?_=" + Date.now());
        if (!res.ok) throw new Error("failed");
        return res.json();
      }

      function buildGallery(items) {
        const gallery = document.getElementById("gallery");
        document.getElementById("loading-msg").remove();
        items.forEach((photo, i) => {
          const item = document.createElement("div");
          item.className = "gallery-item";
          const ar = (photo.width && photo.height)
            ? `${photo.width} / ${photo.height}`
            : "4 / 3";
          item.style.aspectRatio = ar;

          const img = document.createElement("img");
          img.src = photo.src;
          img.alt = photo.alt || "";
          img.loading = "lazy";
          img.decoding = "async";

          const overlay = document.createElement("div");
          overlay.className = "gallery-overlay";

          const overlayBottom = document.createElement("div");
          overlayBottom.className = "gallery-overlay-bottom";

          if (photo.caption) {
            const cap = document.createElement("span");
            cap.className = "gallery-caption";
            cap.textContent = photo.caption;
            overlayBottom.appendChild(cap);
          }

          const detailBtn = document.createElement("a");
          detailBtn.className = "gallery-detail-btn";
          detailBtn.href = `photo/?i=${i}`;
          detailBtn.dataset.i18n = "btn.viewDetails";
          window.portfolioI18n?.apply(detailBtn);
          detailBtn.addEventListener("click", e => e.stopPropagation());
          overlayBottom.appendChild(detailBtn);

          overlay.appendChild(overlayBottom);
          item.appendChild(img);
          item.appendChild(overlay);
          item.addEventListener("click", () => openLightbox(i));
          gallery.appendChild(item);
        });

        window.setupGalleryReveal?.();
      }

      /* ── Lightbox ─────────────────────────────────────────── */
      const lb       = document.getElementById("photo-lb");
      const lbImg    = document.getElementById("lb-img");
      const lbCap    = document.getElementById("lb-caption");
      const lbNewtab = document.getElementById("lb-newtab");

      function triggerImgAnim(cls) {
        lbImg.classList.remove("lb-anim-open", "lb-anim-next", "lb-anim-prev");
        void lbImg.offsetWidth; /* reflow to restart animation */
        lbImg.classList.add(cls);
      }

      function openLightbox(index, animClass = "lb-anim-open") {
        activeIndex = ((index % photos.length) + photos.length) % photos.length;
        const p = photos[activeIndex];
        lbImg.src = p.src;
        lbImg.alt = p.alt || "";
        lbCap.textContent = p.caption || "";
        if (lbNewtab) lbNewtab.href = p.src;
        lb.hidden = false;
        document.body.style.overflow = "hidden";
        triggerImgAnim(animClass);
      }

      function closeLightbox() {
        lb.hidden = true;
        lbImg.src = "";
        lbImg.classList.remove("lb-anim-open", "lb-anim-next", "lb-anim-prev");
        if (lbNewtab) lbNewtab.href = "#";
        document.body.style.overflow = "";
      }

      function navigate(dir) {
        openLightbox(activeIndex + dir, dir > 0 ? "lb-anim-next" : "lb-anim-prev");
      }

      document.getElementById("lb-close").addEventListener("click", closeLightbox);
      document.getElementById("lb-prev").addEventListener("click", () => navigate(-1));
      document.getElementById("lb-next").addEventListener("click", () => navigate(1));
      lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });

      document.addEventListener("keydown", e => {
        if (lb.hidden) return;
        if (e.key === "Escape")     closeLightbox();
        if (e.key === "ArrowLeft")  navigate(-1);
        if (e.key === "ArrowRight") navigate(1);
      });

      let touchStartX = 0;
      lb.addEventListener("touchstart", e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
      });

      /* ── Init ─────────────────────────────────────────────── */
      loadPhotos()
        .then(items => { photos = items; buildGallery(items); })
        .catch(() => {
          const msg = document.getElementById("loading-msg");
          if (msg) msg.textContent = window.portfolioI18n?.t("photo.loadError") || "Could not load photos.";
        });
    </script>
