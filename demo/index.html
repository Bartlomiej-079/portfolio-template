    <script>
      (function () {
        try {
          var key = "portfolio-theme";
          var stored = localStorage.getItem(key);
          var useStored = stored === "dark" || stored === "light";
          var theme = useStored
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          // Use CSS defaults when storage is unavailable.
        }
        try {
          // Default off; only enable when the user explicitly chose on.
          if (localStorage.getItem("portfolio-perf-mode") === "on") {
            document.documentElement.setAttribute("data-perf-mode", "on");
          }
        } catch (_) {}
        try {
          // Default on; only skip when the user explicitly chose off.
          if (localStorage.getItem("portfolio-video-bg") !== "off") {
            document.documentElement.setAttribute("data-video-bg", "on");
          }
        } catch (_) {
          document.documentElement.setAttribute("data-video-bg", "on");
        }
        try {
          // Default off; only an explicit "on" enables the bubbles.
          if (localStorage.getItem("portfolio-animations") === "on") {
            document.documentElement.setAttribute("data-animations", "on");
          }
        } catch (_) {}
        try {
          var supported = /^(en|fr|it|ja|zh)$/;
          var lang = "";
          try { lang = String(localStorage.getItem("portfolio-language") || "").toLowerCase(); } catch (_) {}
          if (!supported.test(lang)) {
            lang = "";
            var list = [];
            try {
              if (navigator.languages) list = list.concat(Array.prototype.slice.call(navigator.languages));
              if (navigator.language) list.push(navigator.language);
            } catch (_) {}
            for (var li = 0; li < list.length && !lang; li += 1) {
              var raw = String(list[li] || "").toLowerCase().replace(/_/g, "-");
              var base = raw.split("-")[0];
              if (supported.test(raw)) lang = raw;
              else if (supported.test(base)) lang = base;
            }
          }
          if (supported.test(lang)) document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>

    <script>
      (function () {
        var siteRoot = window.__SITE_ROOT__ || "/";
        var assetVersion = window.__ASSET_VERSION__ || "1";

        var rewrite = function (src) {
          if (/^(?:https?:)?\/\//i.test(src)) return src;
          return siteRoot + src.replace(/^\/+/, "");
        };

        var scripts = [
          "assets/js/highlight/highlight.min.js",

          "assets/js/i18n.js",
          "assets/js/theme.js",
          "assets/js/carousel.js",
          "assets/js/demo.js"
        ];

        var appendScript = function (index) {
          if (index >= scripts.length) return;
          var script = document.createElement("script");
          script.src = rewrite(scripts[index]) + "?v=" + assetVersion;
          script.onload = function () {
            appendScript(index + 1);
          };
          document.body.appendChild(script);
        };

        appendScript(0);
      })();
